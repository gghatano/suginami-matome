<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5分でわかる｜杉並区イベントまとめ</title>
<meta name="robots" content="noindex">
<script>
  // まとめサイト・児童館カレンダーと同じテーマ設定（localStorage "theme"）を共有する
  try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<!-- 原本は docs/slides.md。このページはそれを「---」の行で区切ってスライドにするだけ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
:root{
  --bg:#e9eef4;--paper:#ffffff;--ink:#1d2733;--muted:#5c6876;--line:#dbe2ea;--accent:#1f63b5;--code:#eef2f7;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1116;--paper:#1a2129;--ink:#e6ebf0;--muted:#9aa6b3;--line:#2c3641;--accent:#7fb0f0;--code:#222a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1116;--paper:#1a2129;--ink:#e6ebf0;--muted:#9aa6b3;--line:#2c3641;--accent:#7fb0f0;--code:#222a33;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column}
a{color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;font-size:.85rem;color:var(--muted)}
header nav{display:flex;gap:14px}
/* 16:9 の台紙。中の文字は台紙の幅に比例させる（cqw） */
main{flex:1;display:grid;place-items:center;padding:0 16px;min-height:0}
.stage{position:relative;width:min(100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;container-type:inline-size}
.slide{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5cqw 6cqw;
  font-size:2.3cqw;line-height:1.6;overflow:hidden;visibility:hidden}
.slide.on{visibility:visible}
.slide h1{font-size:4.6cqw;margin:6cqw 0 1.5cqw;line-height:1.3}
.slide h2{font-size:3.4cqw;margin:0 0 2.5cqw;padding-bottom:1cqw;border-bottom:.25cqw solid var(--accent)}
.slide p,.slide ul,.slide ol{margin:1.2cqw 0}
.slide li{margin:.6cqw 0}
.slide small{color:var(--muted)}
.slide code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:.05em .3em;border-radius:4px}
.slide table{border-collapse:collapse;width:100%;font-size:.92em}
.slide th,.slide td{border:1px solid var(--line);padding:.6cqw 1.2cqw;text-align:left;vertical-align:top}
.slide th{background:var(--code)}
.slide .mermaid{background:#fff;border-radius:8px;padding:1cqw;text-align:center;margin:1.5cqw 0}
.slide .mermaid svg{max-width:100%;height:auto}
footer{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 16px}
footer button{font:inherit;padding:6px 16px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
footer button:disabled{opacity:.4;cursor:default}
#count{min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.raw{white-space:pre-wrap;font-family:var(--f-mono);font-size:.85rem;padding:16px}
/* スマホ：台紙が小さすぎて読めないので、スライドを縦に並べてスクロールで読む */
@media (max-width:760px){
  body{display:block}
  main{display:block}
  .stage{width:auto;aspect-ratio:auto;container-type:normal;display:grid;gap:12px;padding-bottom:24px}
  .slide{position:static;visibility:visible;font-size:15px;padding:18px 16px;overflow:visible}
  .slide h1{font-size:1.5rem;margin:.4em 0 .3em}
  .slide h2{font-size:1.15rem;margin:0 0 .6em;padding-bottom:.25em;border-bottom-width:2px}
  .slide p,.slide ul,.slide ol{margin:.5em 0}
  .slide li{margin:.2em 0}
  .slide th,.slide td{padding:5px 8px}
  .slide .mermaid{padding:6px;margin:.6em 0}
  footer{display:none}
}
</style>
</head>
<body>
<header>
  <span>開発者向け・5分でわかる</span>
  <nav><a href="./">ドキュメント</a><a href="https://github.com/gghatano/suginami-matome/blob/develop/docs/slides.md" target="_blank" rel="noopener">原本（Markdown）</a></nav>
</header>
<main><div class="stage" id="stage"><p class="muted">読み込み中…</p></div></main>
<footer>
  <button id="prev" type="button" aria-label="前のスライド">← 前</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" type="button" aria-label="次のスライド">次 →</button>
</footer>
<script>
const REPO = "https://github.com/gghatano/suginami-matome/blob/develop/";
const stage = document.getElementById("stage");
let slides = [], cur = 0;

// docs の .md へのリンクは閲覧ページで、ほかのファイルは GitHub で開く
function fixLinks(root) {
  root.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (/^(https?:|#|mailto:)/.test(h)) { if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; } return; }
    const u = new URL(h, "https://repo.invalid/docs/slides.md");
    const m = u.pathname.match(/^\/docs\/(.+)\.md$/);
    if (m) { a.href = "./#" + m[1]; return; }
    a.href = REPO + u.pathname.replace(/^\//, ""); a.target = "_blank"; a.rel = "noopener";
  });
}

function show(i) {
  if (!slides.length) return;
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle("on", k === cur));
  document.getElementById("count").textContent = `${cur + 1} / ${slides.length}`;
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === slides.length - 1;
  history.replaceState(null, "", "#" + (cur + 1));
}

async function load() {
  let md;
  try {
    const res = await fetch("slides.md", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch (e) { stage.innerHTML = `<p>slides.md を読み込めませんでした（${e.message}）。</p>`; return; }
  // 「---」だけの行でスライドを区切る
  const parts = md.split(/\n-{3,}\s*\n/);
  if (!window.marked) { document.querySelector("footer").hidden = true; stage.innerHTML = ""; const p = document.createElement("div"); p.className = "raw"; p.textContent = md; stage.appendChild(p); return; }
  stage.innerHTML = "";
  slides = parts.map(src => {
    const s = document.createElement("section");
    s.className = "slide";
    s.innerHTML = marked.parse(src);
    s.querySelectorAll("pre code.language-mermaid").forEach(c => { const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
    fixLinks(s);
    stage.appendChild(s);
    return s;
  });
  const n = parseInt(location.hash.slice(1), 10);
  show(Number.isFinite(n) ? n - 1 : 0);
  if (window.mermaid && stage.querySelector(".mermaid")) {
    try {
      mermaid.initialize({ startOnLoad: false, theme: "default", flowchart: { useMaxWidth: true } });
      await mermaid.run({ nodes: stage.querySelectorAll(".mermaid") });
    } catch (e) { /* 図にできなくても本文は読める */ }
  }
}

// 「#5」のようなアドレスで、そのスライドを開く（ページ内でアドレスだけ変えたときも）
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (Number.isFinite(n) && n - 1 !== cur) show(n - 1); });
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("a,button")) { if (e.key === " " || e.key === "Enter") return; }
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(slides.length - 1);
});
// 台紙の右半分クリックで次、左半分で前（リンクのクリックは除く）
stage.addEventListener("click", e => {
  if (e.target.closest("a") || matchMedia("(max-width:760px)").matches) return;
  const r = stage.getBoundingClientRect();
  show(cur + (e.clientX - r.left > r.width / 2 ? 1 : -1));
});
load();
</script>
</body>
</html>
