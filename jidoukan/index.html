<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杉並区 児童館カレンダー</title>
<meta name="description" content="杉並区の児童館のおたより（PDF）から、行事の日程と申込の受付開始日をカレンダーにまとめています。毎週更新。">
<script>
  // まとめサイトと同じテーマ設定（localStorage "theme"）を共有する
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 申込が必要な行事（いま動くべきもの）を先頭に、下に月のマス目。スマホではマス目を日ごとの一覧に切り替える */
:root{
  --bg:#f6f8fb;--paper:#ffffff;--ink:#1d2733;--muted:#5c6876;--line:#dbe2ea;
  --kids:#1f63b5;--kids-soft:#e4eefb;--baby:#2f8a4e;--baby-soft:#e3f3e8;
  --open:#d9480f;--open-soft:#fff0e6;--on-open:#ffffff;--closed:#7b8591;--closed-soft:#eef1f4;--today:#f2b705;
  /* 施設ごとの色（sources.json の並び順に割り当てる） */
  --f1:#0f766e;--f1s:#dcf3ef;--f2:#6d28d9;--f2s:#eee7fc;--f3:#be185d;--f3s:#fce6ef;--f4:#4d7c0f;--f4s:#eaf4d9;--f5:#1d4ed8;--f5s:#e2eafc;--f6:#8a5a2b;--f6s:#f5ece2;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d;--paper:#1a2129;--ink:#e6ebf0;--muted:#9aa6b3;--line:#2c3641;
  --kids:#7fb0f0;--kids-soft:#1c2c42;--baby:#6fcf90;--baby-soft:#183126;
  --open:#ff8a4c;--open-soft:#3a2216;--on-open:#1a1008;--closed:#8590a0;--closed-soft:#222a33;--today:#f2c94c;--f1:#5eead4;--f1s:#12302d;--f2:#c4b5fd;--f2s:#271f3d;--f3:#f9a8d4;--f3s:#3a1a2a;--f4:#bef264;--f4s:#232e17;--f5:#93b4f8;--f5s:#1b2642;--f6:#e6b98a;--f6s:#33271b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d;--paper:#1a2129;--ink:#e6ebf0;--muted:#9aa6b3;--line:#2c3641;
  --kids:#7fb0f0;--kids-soft:#1c2c42;--baby:#6fcf90;--baby-soft:#183126;
  --open:#ff8a4c;--open-soft:#3a2216;--on-open:#1a1008;--closed:#8590a0;--closed-soft:#222a33;--today:#f2c94c;--f1:#5eead4;--f1s:#12302d;--f2:#c4b5fd;--f2s:#271f3d;--f3:#f9a8d4;--f3s:#3a1a2a;--f4:#bef264;--f4s:#232e17;--f5:#93b4f8;--f5s:#1b2642;--f6:#e6b98a;--f6s:#33271b;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:900}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--kids)}
.muted{color:var(--muted)} .small{font-size:.82rem} .num{font-variant-numeric:tabular-nums}
header{display:grid;gap:8px}
.topnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem}
.src{font-size:.85rem;color:var(--muted)}
.sec{display:grid;gap:14px}

/* 申込カードは横1列。件数が増えても高さは1枚分のまま、横にスクロールする */
.apply-grid{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:6px}
.apply-grid > .empty{grid-column:1/-1}
@media (max-width:520px){.apply-grid{grid-auto-columns:78vw}}
.apply{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0;scroll-snap-align:start}
.apply h3{font-size:.98rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.apply-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.apply-top .status{justify-self:auto}
.apply-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.apply-head .small{color:var(--muted)}
.apply.is-urgent{border-color:var(--open);box-shadow:0 0 0 1px var(--open) inset}
.status{justify-self:start;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;letter-spacing:.04em}
.st-before{background:var(--open);color:var(--on-open)}
.st-open{background:var(--open-soft);color:var(--open);border:1px solid var(--open)}
.st-closed{background:var(--closed-soft);color:var(--closed)}
.apply dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:.84rem}
.apply dt{color:var(--muted)} .apply dd{margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.aud{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:4px}
.aud-kids{background:var(--kids-soft);color:var(--kids)}
.aud-baby,.aud-all{background:var(--baby-soft);color:var(--baby)}
.ctr{font-size:.75rem;padding:1px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.note{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;font-size:.88rem}
.empty{color:var(--muted);font-size:.9rem}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav h2{min-width:8.5em;text-align:center}
.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.chk input:focus-visible,select:focus-visible{outline:2px solid var(--today);outline-offset:2px}
select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:.85rem}
.share{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.share input{flex:1 1 220px;min-width:0;font:inherit;font-size:.8rem;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.picker{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:8px}
.picker-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.picker-head b{font-family:var(--f-display);font-size:1rem}
.nm-short{display:none}
@media (max-width:520px){.nm-full{display:none}.nm-short{display:inline}.apply-head .small:last-child{display:none}}
.picker-acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.linkbtn{font:inherit;font-size:.8rem;background:none;border:0;color:var(--kids);cursor:pointer;padding:0;text-decoration:underline}
.ctrs .btn[aria-pressed="true"]{background:var(--kids);color:var(--paper);border-color:var(--kids)}
.ctrs .btn[aria-pressed="false"]{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

.cal{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{font-size:.8rem;font-weight:700;text-align:center;padding:6px 0;background:var(--closed-soft);color:var(--muted)}
.cal-head .sun{color:var(--open)} .cal-head .sat{color:var(--kids)}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:120px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:nth-child(7n+1){border-left:0}
.cell.blank{background:var(--bg)}
.cell.off{background:var(--closed-soft)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.dnum{font-family:var(--f-display);font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.dnum .hol{font-family:var(--f-body);font-weight:400;font-size:.7rem;color:var(--closed);text-align:right}
.sun-n{color:var(--open)} .sat-n{color:var(--kids)}

.chip{font:inherit;font-size:.74rem;line-height:1.35;border-radius:5px;padding:3px 6px;border:0;border-left:3px solid;min-width:0;overflow-wrap:anywhere;cursor:pointer;text-align:left;color:var(--ink);width:100%;background:transparent}
.chip:focus-visible{outline:2px solid var(--today);outline-offset:1px}
.chip .t{font-variant-numeric:tabular-nums;color:var(--muted);display:block;font-size:.7rem}
/* チップの色は施設を表す（対象は上の絞り込みで切り替える） */
.chip.ev{background:var(--fs);border-color:var(--fc)}
.chip.reg{background:transparent;border-left-width:2px}
.chip .must{font-weight:700;color:var(--open)}
.chip .cn{color:var(--muted)}
.chip.start{background:var(--open);color:var(--on-open);border-color:var(--fc,var(--open));border-left-width:4px;font-weight:700}
.chip.start .t,.chip.start .cn{color:var(--on-open);opacity:.9}
.chip.end{background:var(--open-soft);color:var(--open);border-color:var(--fc,var(--open));border-left-style:dashed}
.ctr.fc{border-color:var(--fc);color:var(--fc);font-weight:700}
.ctrs .btn[aria-pressed="true"].fc{background:var(--fc);border-color:var(--fc);color:var(--paper)}
.ctrs .btn .dot,.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--fc);margin-right:6px;vertical-align:-1px}
.ctrs .btn[aria-pressed="true"] .dot{background:var(--paper)}

.agenda{display:none;gap:10px}
.aday{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:3.2rem 1fr;gap:10px}
.aday.today{box-shadow:inset 0 0 0 2px var(--today)}
.aday .d{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.1}
.aday .d small{display:block;font-size:.75rem;font-weight:500;color:var(--muted)}
.aday .list{display:grid;gap:5px;min-width:0}
@media (max-width:760px){.cal{display:none}.agenda{display:grid}}

.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.det{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0;scroll-margin-top:16px}
.det.flash{box-shadow:0 0 0 3px var(--today)}
.det ul{margin:0;padding-left:1.1em;font-size:.88rem}
footer{font-size:.8rem;color:var(--muted);display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topnav"><a href="../">← 杉並区イベントまとめ</a><span class="muted" id="updated"></span></div>
    <h1>杉並区 児童館カレンダー</h1>
    <p class="src">おたより（PDF）から行事と申込の受付開始日を毎週まとめています。自動で読み取っているため、申し込む前に原本も確認してください。</p>
  </header>

  <section class="picker" aria-labelledby="pick-h">
    <div class="picker-head"><b id="pick-h">表示する児童館</b><span class="picker-acts"><button type="button" class="linkbtn" id="selAll">すべて選ぶ</button><button type="button" class="linkbtn" id="selNone">すべて外す</button><button type="button" class="btn" id="copyUrl" title="選んだ児童館・対象・表示のまま開けるURL。ブックマークや共有に">この表示のURLをコピー</button></span></div>
    <div class="seg ctrs" id="ctrs" role="group" aria-label="表示する児童館"></div>
    <div class="share" id="shareRow" hidden>
      <span class="small muted" id="copyMsg"></span>
      <input type="text" id="urlBox" readonly hidden aria-label="この表示のURL">
    </div>
  </section>

  <section class="sec" aria-labelledby="apply-h">
    <div class="apply-head"><h2 id="apply-h">これから申し込める行事</h2><span class="small" id="applyCount"></span><span class="small">（小学生以上の行事は、多くの館で<b>子ども本人が受付で</b>申し込みます）</span></div>
    <div class="apply-grid" id="applyGrid"><p class="empty">読み込み中…</p></div>
  </section>

  <section class="sec" aria-labelledby="cal-h">
    <div class="bar">
      <div class="monthnav">
        <button type="button" class="btn" id="prevM" aria-label="前の月">‹</button>
        <h2 id="cal-h">—</h2>
        <button type="button" class="btn" id="nextM" aria-label="次の月">›</button>
      </div>
      <div class="seg" id="audSeg" role="group" aria-label="対象で絞り込む">
        <button type="button" class="btn" id="f-all" data-f="all" aria-pressed="true">すべて</button>
        <button type="button" class="btn" id="f-kids" data-f="kids" aria-pressed="false">小学生以上</button>
        <button type="button" class="btn" id="f-baby" data-f="baby" aria-pressed="false">乳幼児親子</button>
      </div>
      <label class="chk"><input type="checkbox" id="showReg"> 毎日・毎週のプログラムも表示</label>
    </div>
    <div class="legend">
      <span id="legendCenters" style="display:contents"></span>
      <span><i class="sw" style="background:var(--open)"></i>申込の受付開始日</span>
      <span><i class="sw" style="border:1px solid var(--muted)"></i>毎日・毎週のプログラム（枠なし）</span>
      <span><i class="sw" style="background:var(--closed-soft);border:1px solid var(--line)"></i>休館日</span>
    </div>
    <div class="cal" id="cal">
      <div class="cal-head"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div>
      <div class="cal-body" id="calBody"></div>
    </div>
    <div class="agenda" id="agenda"></div>
    <p class="small muted" id="monthSrc"></p>
  </section>

  <section class="sec" aria-labelledby="det-h">
    <h2 id="det-h">この月の行事の詳細</h2>
    <div class="details" id="details"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const WD = "日月火水木金土";
const pad = n => String(n).padStart(2, "0");
const now = new Date();
const TODAY = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => { const [, m, d] = s.split("-").map(Number); return `${m}/${d}（${WD[new Date(s + "T00:00:00").getDay()]}）`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const tm = s => s.start ? `${s.start}${s.end ? "–" + s.end : ""}` : "";
const audLabel = a => a === "kids" ? "小学生以上" : a === "baby" ? "乳幼児親子" : "どなたでも";

// 外した児童館を覚える（あとから増えた児童館は最初から選ばれた状態になる）
let DB = null, CENTERS = {}, curY, curM, filt = "all", showReg = false, deselected = new Set();
const sel = () => new Set(DB.centers.map(c => c.key).filter(k => !deselected.has(k)));
const isSel = k => !deselected.has(k);
try {
  filt = localStorage.getItem("jdk-filt") || "all";
  showReg = localStorage.getItem("jdk-reg") === "1";
  deselected = new Set(JSON.parse(localStorage.getItem("jdk-off") || "[]"));
} catch (_) {}

function visible(e) {
  if (!isSel(e.center)) return false;
  if (filt !== "all" && !(e.audience === filt || e.audience === "all")) return false;
  return true;
}
function lastDate(e) { return e.sessions[e.sessions.length - 1].date; }

function status(e) {
  if (TODAY > lastDate(e)) return { cls: "st-closed", txt: "開催済み", rank: 3 };
  if (!e.application_start) return { cls: "st-open", txt: "受付日は原本で確認", rank: 2 };
  if (TODAY < e.application_start) {
    const n = daysBetween(TODAY, e.application_start);
    return { cls: "st-before", txt: n === 1 ? "明日から受付" : `あと${n}日で受付開始`, urgent: n <= 2, rank: 0 };
  }
  if (e.application_end && TODAY > e.application_end) return { cls: "st-closed", txt: "受付終了", rank: 3 };
  return { cls: "st-open", txt: e.application_end ? `受付中（${md(e.application_end)}まで）` : "受付中（先着順）", urgent: true, rank: 1 };
}

function renderApply() {
  const list = DB.events.filter(e => e.requires_application && visible(e) && lastDate(e) >= TODAY)
    .map(e => ({ e, s: status(e) }))
    .filter(x => x.s.cls !== "st-closed")
    .sort((a, b) => a.s.rank - b.s.rank || (a.e.application_start || "").localeCompare(b.e.application_start || "") || a.e.sessions[0].date.localeCompare(b.e.sessions[0].date));
  const g = document.getElementById("applyGrid");
  const cnt = document.getElementById("applyCount");
  if (!list.length) { cnt.textContent = ""; g.innerHTML = `<p class="empty">いま申し込める行事・これから受付が始まる行事はありません。</p>`; return; }
  g.innerHTML = list.map(({ e, s }) => {
    const ses = e.sessions.map(x => `${md(x.date)} ${tm(x)}`).join("、");
    return `<article class="apply${s.urgent ? " is-urgent" : ""}">
      <div class="apply-top"><span class="status ${s.cls}">${s.txt}</span><a class="small" href="${esc(e.pdf_url)}" target="_blank" rel="noopener">原本PDF</a></div>
      <h3>${esc(e.title)}</h3>
      <div class="tags"><span class="aud aud-${e.audience}">${audLabel(e.audience)}</span><span class="ctr fc" style="${fcVar(e.center)}" title="${esc(CENTERS[e.center]?.name)}">${esc(shortName(e.center))}</span></div>
      <dl>
        <dt>開催</dt><dd class="num">${esc(ses)}</dd>
        <dt>受付開始</dt><dd class="num">${e.application_start ? `<b>${md(e.application_start)}</b>${e.application_end ? ` 〜 ${md(e.application_end)}` : " 〜 定員まで"}` : "—"}</dd>
        ${e.capacity ? `<dt>定員</dt><dd>${esc(e.capacity)}</dd>` : ""}
        <dt>申込</dt><dd>${esc(e.application_method || "原本で確認")}${CENTERS[e.center]?.tel ? `<br><span class="num">☎ ${esc(CENTERS[e.center].tel)}</span>` : ""}</dd>
      </dl>
    </article>`;
  }).join("");
  // カードがはみ出すときだけ、横にスクロールできることを書き添える
  requestAnimationFrame(() => {
    cnt.textContent = `${list.length}件` + (g.scrollWidth > g.clientWidth + 4 ? "・横にスクロールで続きを表示" : "");
  });
}

function closedOn(d) {
  return DB.months.filter(m => isSel(m.center))
    .flatMap(m => m.closed_days.filter(c => c.date === d).map(c => ({ ...c, center: m.center })));
}
function itemsFor(d) {
  const out = [];
  for (const e of DB.events) {
    if (!visible(e)) continue;
    if (e.requires_application) {
      if (e.application_start === d) out.push({ k: "start", e, sort: "00" });
      if (e.application_end === d) out.push({ k: "end", e, sort: "01" });
    }
    if (e.regular && !showReg) continue;
    for (const s of e.sessions) if (s.date === d) out.push({ k: "ev", e, s, sort: s.start || "99" });
  }
  return out.sort((a, b) => a.sort.localeCompare(b.sort));
}
const multi = () => sel().size > 1;
// 施設の色（sources.json の並び順で6色を順に使う）
const fcVar = k => { const i = DB.centers.findIndex(c => c.key === k) % 6 + 1; return `--fc:var(--f${i});--fs:var(--f${i}s)`; };
const shortName = k => CENTERS[k]?.short || (CENTERS[k]?.name || "").replace("児童館", "");
function chip(it) {
  const e = it.e, cn = multi() ? `<span class="cn">［${esc(shortName(e.center))}］</span>` : "";
  if (it.k === "start") return `<button type="button" class="chip start" style="${fcVar(e.center)}" data-id="${e.id}"><span class="t">申込受付開始</span>${cn}${esc(e.title)}</button>`;
  if (it.k === "end") return `<button type="button" class="chip end" style="${fcVar(e.center)}" data-id="${e.id}"><span class="t">申込締切</span>${cn}${esc(e.title)}</button>`;
  return `<button type="button" class="chip ev ${e.audience}${e.regular ? " reg" : ""}" style="${fcVar(e.center)}" data-id="${e.id}"><span class="t">${tm(it.s) || "時間は原本で確認"}</span>${cn}${e.requires_application ? '<span class="must">申込制 </span>' : ""}${esc(e.title)}</button>`;
}

function renderCal() {
  document.getElementById("cal-h").textContent = `${curY}年${curM}月`;
  document.getElementById("legendCenters").innerHTML = DB.centers.filter(c => isSel(c.key)).map(c =>
    `<span style="${fcVar(c.key)}"><i class="dot"></i>${esc(shortName(c.key))}</span>`).join("");
  const first = new Date(curY, curM - 1, 1).getDay(), last = new Date(curY, curM, 0).getDate();
  let h = "", ag = "";
  for (let i = 0; i < first; i++) h += `<div class="cell blank"></div>`;
  for (let d = 1; d <= last; d++) {
    const ds = `${curY}-${pad(curM)}-${pad(d)}`, w = (first + d - 1) % 7;
    const off = closedOn(ds), items = itemsFor(ds), isToday = ds === TODAY;
    const allOff = off.length && off.length >= sel().size;
    // 選んだ全館が同じ理由で休みなら館名を省く
    const sameReason = allOff && new Set(off.map(o => o.reason)).size === 1;
    const offTxt = sameReason ? off[0].reason + "・休館"
      : [...new Set(off.map(o => o.reason))].map(r => {
          // 同じ理由で休みの館はまとめて「方南・堀ノ内東：館内整理日・休館」と出す
          const names = off.filter(o => o.reason === r).map(o => shortName(o.center)).join("・");
          return (multi() ? names + "：" : "") + r + "・休館";
        }).join(" / ");
    const nc = w === 0 ? "sun-n" : w === 6 ? "sat-n" : "";
    h += `<div class="cell${allOff ? " off" : ""}${isToday ? " today" : ""}"><div class="dnum"><span class="${nc}">${d}</span>${offTxt ? `<span class="hol">${esc(offTxt)}</span>` : isToday ? '<span class="hol">今日</span>' : ""}</div>${items.map(chip).join("")}</div>`;
    if (items.length || off.length) ag += `<div class="aday${isToday ? " today" : ""}"><div class="d ${nc}">${d}<small>${WD[w]}曜${isToday ? "・今日" : ""}</small></div><div class="list">${offTxt ? `<span class="small muted">${esc(offTxt)}</span>` : ""}${items.map(chip).join("")}</div></div>`;
  }
  const rest = (7 - (first + last) % 7) % 7;
  for (let i = 0; i < rest; i++) h += `<div class="cell blank"></div>`;
  document.getElementById("calBody").innerHTML = h;
  document.getElementById("agenda").innerHTML = ag || `<p class="empty">この月の行事はまだありません。</p>`;

  const ms = DB.months.filter(m => m.year === curY && m.month === curM && isSel(m.center));
  document.getElementById("monthSrc").innerHTML = ms.length
    ? "出典：" + ms.map(m => `<a href="${esc(m.pdf_url)}" target="_blank" rel="noopener">${esc(CENTERS[m.center]?.name)} ${m.month}月号</a>`).join("、") + "。時刻は24時間表記です（おたよりの「4:00」は16:00）。"
    : "この月のおたよりはまだ出ていないか、読み取れていません。前の月のおたよりで予告された行事だけを表示しています。";
  const ym = curY * 12 + curM, yms = monthsAvail();
  document.getElementById("prevM").disabled = !yms.some(x => x < ym);
  document.getElementById("nextM").disabled = !yms.some(x => x > ym);
  renderDetails();
}

function renderDetails() {
  const pre = `${curY}-${pad(curM)}-`;
  const evs = DB.events.filter(e => visible(e) && e.sessions.some(s => s.date.startsWith(pre)))
    .sort((a, b) => (a.regular - b.regular) || a.sessions[0].date.localeCompare(b.sessions[0].date));
  document.getElementById("details").innerHTML = evs.map(e => {
    const days = e.sessions.filter(s => s.date.startsWith(pre)).map(s => `${+s.date.slice(8)}日（${WD[new Date(s.date + "T00:00:00").getDay()]}）${tm(s)}`);
    return `<article class="det" id="det-${e.id}">
      <div class="tags"><span class="aud aud-${e.audience}">${audLabel(e.audience)}</span><span class="ctr fc" style="${fcVar(e.center)}">${esc(CENTERS[e.center]?.name)}</span>${e.regular ? '<span class="small muted">毎週のプログラム</span>' : ""}${e.requires_application ? '<span class="small" style="color:var(--open);font-weight:700">申込制</span>' : ""}</div>
      <h3>${esc(e.title)}</h3>${e.subtitle ? `<p class="small muted">${esc(e.subtitle)}</p>` : ""}
      <p class="small num">${esc(days.join("、"))}</p>
      <ul>${e.place ? `<li>場所：${esc(e.place)}</li>` : ""}${e.target ? `<li>対象：${esc(e.target)}</li>` : ""}${e.capacity ? `<li>${esc(e.capacity)}</li>` : ""}${e.requires_application ? `<li><b>申込：${e.application_start ? md(e.application_start) + "から" : "受付日は原本で確認"}${e.application_end ? md(e.application_end) + "まで" : ""}${e.application_method ? `（${esc(e.application_method)}）` : ""}</b></li>` : ""}${(e.notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>
    </article>`;
  }).join("") || `<p class="empty">この月の行事はありません。</p>`;
}

function monthsAvail() {
  // おたよりの号がある月に加え、予告された行事や申込開始日がある月（翌月の予告など）にも移動できるようにする
  const ym = s => { const [y, m] = s.split("-").map(Number); return y * 12 + m; };
  const set = new Set(DB.months.filter(m => isSel(m.center)).map(m => m.year * 12 + m.month));
  DB.events.filter(e => isSel(e.center)).forEach(e => {
    e.sessions.forEach(x => set.add(ym(x.date)));
    if (e.application_start) set.add(ym(e.application_start));
  });
  return [...set].sort((a, b) => a - b);
}
function renderAll() { renderApply(); renderCal(); }

// ---- URLパラメータ（共有用）
// ?center=honan,horinouchi_higashi  表示する児童館（省略時は全館）
// ?target=kids|baby                 対象（省略時はすべて）
// ?regular=1                        毎日・毎週のプログラムも表示
// ?month=2026-11                    表示する月（旧形式 #m202611 も読む）
// パラメータがあればURLだけで表示を決める（ブラウザに保存した選択は使わない）。画面で選択を変えるとURLも書き換わる。
let monthPinned = false;
function applyParams() {
  const q = new URLSearchParams(location.search);
  // パラメータが1つでもあれば、共有した人と同じ画面になるよう、書かれていない項目は初期値にする
  if (["center", "target", "regular", "month"].some(k => q.has(k))) {
    deselected = new Set(); filt = "all"; showReg = false;
  }
  if (q.has("center")) {
    const want = new Set(q.get("center").split(",").map(x => x.trim()).filter(k => CENTERS[k]));
    if (want.size) deselected = new Set(DB.centers.map(c => c.key).filter(k => !want.has(k)));
  }
  if (q.has("target")) {
    const t = q.get("target");
    filt = ["kids", "baby"].includes(t) ? t : "all";
  }
  if (q.has("regular")) showReg = q.get("regular") === "1";
  const m = /^(\d{4})-(\d{1,2})$/.exec(q.get("month") || "") || /^#m(\d{4})(\d{2})$/.exec(location.hash);
  if (m && +m[2] >= 1 && +m[2] <= 12) { curY = +m[1]; curM = +m[2]; monthPinned = true; return true; }
  return false;
}
function syncURL() {
  const q = new URLSearchParams();
  const s = sel();
  if (s.size && s.size < DB.centers.length) q.set("center", [...s].join(","));
  if (filt !== "all") q.set("target", filt);
  if (showReg) q.set("regular", "1");
  if (monthPinned) q.set("month", `${curY}-${pad(curM)}`);
  const qs = q.toString().replace(/%2C/g, ",");
  history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
}
function go(delta) {
  const yms = monthsAvail(), ym = curY * 12 + curM;
  const next = delta < 0 ? yms.filter(x => x < ym).pop() : yms.find(x => x > ym);
  if (next == null) return;
  curY = Math.floor((next - 1) / 12); curM = next - curY * 12;
  monthPinned = true;
  syncURL();
  renderCal();
}

async function init() {
  try {
    const res = await fetch("../data/jidoukan/events.json", { cache: "no-store" });
    DB = await res.json();
  } catch (err) {
    document.getElementById("applyGrid").innerHTML = `<p class="empty">データを読み込めませんでした。時間をおいて再読み込みしてください。</p>`;
    return;
  }
  DB.centers.forEach(c => CENTERS[c.key] = c);
  const fromURL = applyParams();
  renderPicker();
  document.querySelectorAll("#audSeg .btn").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === filt));
  document.getElementById("showReg").checked = showReg;

  if (!fromURL) {
    const yms = monthsAvail(), ym = now.getFullYear() * 12 + now.getMonth() + 1;
    const pick = yms.includes(ym) ? ym : (yms.filter(x => x <= ym).pop() ?? yms[0] ?? ym);
    curY = Math.floor((pick - 1) / 12); curM = pick - curY * 12;
  }
  const g = new Date(DB.generated_at);
  document.getElementById("updated").textContent = `データ更新：${g.getFullYear()}/${g.getMonth() + 1}/${g.getDate()}`;
  document.getElementById("foot").innerHTML = DB.centers.map(c =>
    `<p>${esc(c.name)}：${esc(c.address || "")} ・ TEL ${esc(c.tel || "")} ・ <a href="${esc(c.page_url)}" target="_blank" rel="noopener">区のページ</a></p>`).join("") +
    `<p>開館日時・休館日は各児童館のおたよりで確認してください。</p>`;
  syncURL();
  renderAll();
}

document.querySelectorAll("#audSeg .btn").forEach(b => b.addEventListener("click", () => {
  filt = b.dataset.f;
  document.querySelectorAll("#audSeg .btn").forEach(x => x.setAttribute("aria-pressed", x === b));
  try { localStorage.setItem("jdk-filt", filt); } catch (_) {}
  syncURL();
  renderAll();
}));
document.getElementById("showReg").addEventListener("change", ev => {
  showReg = ev.target.checked;
  try { localStorage.setItem("jdk-reg", showReg ? "1" : "0"); } catch (_) {}
  syncURL();
  renderCal();
});
function renderPicker() {
  document.getElementById("ctrs").innerHTML = DB.centers.map(c =>
    `<button type="button" class="btn fc" style="${fcVar(c.key)}" data-c="${esc(c.key)}" aria-pressed="${isSel(c.key)}"><i class="dot"></i><span class="nm-full">${esc(c.name)}</span><span class="nm-short">${esc(shortName(c.key))}</span></button>`).join("");
}
function saveSel() {
  try { localStorage.setItem("jdk-off", JSON.stringify([...deselected])); } catch (_) {}
  syncURL();
  renderPicker();
  renderAll();
}
document.getElementById("ctrs").addEventListener("click", ev => {
  const b = ev.target.closest("[data-c]"); if (!b) return;
  const k = b.dataset.c;
  deselected.has(k) ? deselected.delete(k) : deselected.add(k);
  saveSel();
});
document.getElementById("selAll").addEventListener("click", () => { deselected = new Set(); saveSel(); });
document.getElementById("selNone").addEventListener("click", () => { deselected = new Set(DB.centers.map(c => c.key)); saveSel(); });
document.getElementById("prevM").addEventListener("click", () => go(-1));
document.getElementById("nextM").addEventListener("click", () => go(1));
document.addEventListener("click", ev => {
  const c = ev.target.closest(".chip"); if (!c) return;
  const t = document.getElementById("det-" + c.dataset.id);
  if (!t) {
    // 申込開始チップが別の月の行事を指している場合は、その月へ移動する
    const e = DB.events.find(x => x.id === c.dataset.id); if (!e) return;
    const [y, m] = e.sessions[0].date.split("-").map(Number);
    curY = y; curM = m; monthPinned = true; syncURL(); renderCal();
    return document.getElementById("det-" + e.id)?.scrollIntoView({ block: "center" });
  }
  t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1600);
});
document.getElementById("copyUrl").addEventListener("click", async () => {
  const url = location.href.split("#")[0];
  const msg = document.getElementById("copyMsg"), box = document.getElementById("urlBox");
  try {
    await navigator.clipboard.writeText(url);
    document.getElementById("shareRow").hidden = false;
    msg.textContent = "コピーしました。ブックマークやメッセージに貼り付けると、この表示のまま開けます。";
    box.hidden = true;
  } catch (_) {
    // クリップボードが使えないブラウザでは、URLを表示して選択状態にする
    document.getElementById("shareRow").hidden = false;
    box.value = url; box.hidden = false; box.focus(); box.select();
    msg.textContent = "下のURLを長押し（または Ctrl+C）でコピーしてください。";
  }
});
init();
</script>
