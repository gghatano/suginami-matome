name: Fetch Jidoukan Newsletters

# 児童館のおたより（PDF）を Claude API で読み取り、児童館カレンダー（/jidoukan/）のデータを更新する。
# 通常の週次更新は Claude のスケジュールしたタスクが行う（scrapers/jidoukan/SESSION.md、APIキー不要）。
# このワークフローは API で読み取りたいときの手動実行用。
# 必要なシークレット: ANTHROPIC_API_KEY（Settings → Secrets and variables → Actions）

on:
  workflow_dispatch:

concurrency:
  group: jidoukan
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml anthropic
      - name: Fetch and extract newsletters
        id: run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrapers/jidoukan/fetch.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jidoukan
          git diff --cached --quiet || git commit -m "chore: update jidoukan calendar $(date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      # 読み取りに失敗した号があれば、データをコミットしたうえでジョブを失敗にして気づけるようにする
      - name: Report extraction failures
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::一部のおたよりを読み取れませんでした。ログを確認してください（ANTHROPIC_API_KEY 未設定の可能性あり）。"
          exit 1
    # main への push により本番（Cloudflare Workers）が自動デプロイされる
