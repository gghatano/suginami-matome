name: Deploy to GitHub Pages

# GitHub Pages は main ブランチの写し（本番の Cloudflare Workers と同じ内容）を配信する。
# 変更の事前確認は、PR ごとに Cloudflare が作るプレビュー URL で行う。
# （以前は develop ブランチを配信するテスト環境だったが、develop が無くなり更新が止まっていた）

on:
  # PR のマージや、児童館カレンダーの週次更新など、main への push で更新
  push:
    branches: [main]
  # 毎日のイベント更新は GitHub Actions 自身が push するため、上の push では起動しない。
  # ワークフローの完了をきっかけに更新する。
  workflow_run:
    workflows: ["Fetch Events", "Fetch Jidoukan Newsletters"]
    types: [completed]
  # 手動実行も可能
  workflow_dispatch:

# 同時デプロイは1つに制限（実行中のものは完了させる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 本番と同じ main を配信（workflow_run のときも最新の main を取る）
      - uses: actions/configure-pages@v5
        with:
          # Pages を「GitHub Actions」ビルドタイプで自動有効化
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - uses: actions/deploy-pages@v4
        id: deployment
